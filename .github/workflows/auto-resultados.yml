name: 🤖 Auto-Resultados Mundial 2026

on:
  # Corre automáticamente cada 5 minutos durante el Mundial
  schedule:
    - cron: '*/5 * * * *'

  # También se puede disparar manualmente desde la pestaña Actions en GitHub
  workflow_dispatch:
    inputs:
      mensaje:
        description: 'Mensaje de commit personalizado (opcional)'
        required: false
        default: ''

jobs:
  fetch-and-commit:
    runs-on: ubuntu-latest
    # Permiso para hacer commit al repo
    permissions:
      contents: write

    steps:
      - name: 📥 Checkout del repo
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: 🐍 Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: 📡 Consultar API y actualizar resultados
        run: python scripts/fetch_resultados.py

      - name: 🔍 Verificar si hubo cambios
        id: changes
        run: |
          git diff --quiet json/resultados.json && echo "changed=false" >> $GITHUB_OUTPUT || echo "changed=true" >> $GITHUB_OUTPUT

      - name: 💾 Commit y push si hay cambios
        if: steps.changes.outputs.changed == 'true'
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          # Determinar mensaje de commit
          if [ -n "${{ github.event.inputs.mensaje }}" ]; then
            MSG="${{ github.event.inputs.mensaje }}"
          else
            MSG="🤖 Resultados actualizados $(date -u '+%d/%m %H:%M UTC')"
          fi

          git add json/resultados.json
          git commit -m "$MSG"
          git push

      - name: ✅ Sin cambios
        if: steps.changes.outputs.changed == 'false'
        run: echo "Sin resultados nuevos — nada que commitear"